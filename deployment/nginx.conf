user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  map $host $app_root {
    default /usr/share/nginx/html;
    panel.omam.ir /usr/share/nginx/panel;
  }
  server {
    listen 80;
    root $app_root;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options nosniff always;
    location = /api { return 308 /api/; }
    location /api/ {
      proxy_pass http://127.0.0.1:3001/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 75s;
    }
    location = /admin { return 308 /admin/; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location /admin/assets/ { try_files $uri =404; }
    location = /electron { return 308 /electron/; }
    location = /electron/ {
      default_type application/json;
      return 200 '{"available":false,"platform":"macos","architecture":"arm64","code":"RELEASE_PENDING"}';
    }
    location /electron/ { try_files $uri =404; }
    location / { try_files $uri $uri.html $uri/ /index.html; }
    location = /sw.js {
      add_header Cache-Control "no-cache";
      add_header Cross-Origin-Opener-Policy same-origin always;
      add_header Cross-Origin-Embedder-Policy require-corp always;
    }
    location /_expo/ { try_files $uri =404; }
  }
}
