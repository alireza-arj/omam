services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-omam}
      TZ: ${TZ:-Asia/Tehran}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omam} -d ${POSTGRES_DB:-omam}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-omam}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-omam}?schema=public
      HOST: 0.0.0.0
      PORT: 3001
      TZ: ${TZ:-Asia/Tehran}
      # Comma-separated origins. Narrow this to the panel's URL in production.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SEED_ORG_NAME: ${SEED_ORG_NAME:-Omam Team}
      SEED_ORG_SLUG: ${SEED_ORG_SLUG:-omam}
      SEED_OWNER_USERNAME: ${SEED_OWNER_USERNAME:-owner}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:?set SEED_OWNER_PASSWORD in .env}
    ports:
      - "${API_PORT:-3001}:3001"

  admin:
    build:
      context: .
      target: admin
      args:
        # Baked into the bundle: the browser calls this, so it must be the
        # address the API answers on publicly.
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${ADMIN_PORT:-8080}:80"

volumes:
  db-data:
